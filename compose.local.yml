# Local WSL2 Docker Compose for Meet
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   cp .env.local .env
#   docker compose -f compose.local.yml up -d
#
# Service URLs once running:
#   Frontend  → http://localhost
#   Keycloak  → http://localhost:8083  (admin / admin)
#   Minio     → http://localhost:9001  (meet / password)
#   LiveKit   → ws://localhost:7880
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Database ──────────────────────────────────────────────────────────────
  postgresql:
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_DB: meet
      POSTGRES_USER: meet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - ./data/db:/var/lib/postgresql/data

  # ── Keycloak database ─────────────────────────────────────────────────────
  keycloak-postgresql:
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - ./data/keycloak-db:/var/lib/postgresql/data

  # ── Keycloak (local OIDC provider) ────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgresql:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8083
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8083:8080"
    volumes:
      - ./docker/auth/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      keycloak-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7
    restart: unless-stopped

  # ── LiveKit ───────────────────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /config.yaml
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./docker/local/livekit-server.yaml:/config.yaml:ro
    depends_on:
      - redis

  # ── Object storage (MinIO) ────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-meet}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-password}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 20s
      retries: 30

  # Auto-create the recordings bucket in MinIO on first start
  minio-init:
    image: minio/mc
    restart: on-failure
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ${MINIO_USER:-meet} ${MINIO_PASSWORD:-password} &&
        mc mb --ignore-existing local/recordings &&
        mc anonymous set download local/recordings &&
        exit 0"
    depends_on:
      minio:
        condition: service_healthy

  # ── LiveKit Egress (recording) ────────────────────────────────────────────
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /config.yaml
    volumes:
      - ./docker/local/livekit-egress.yaml:/config.yaml:ro
    depends_on:
      - livekit
      - redis

  # ── Django backend ────────────────────────────────────────────────────────
  backend:
    image: lasuite/meet-backend:latest
    restart: unless-stopped
    user: "1000"
    environment:
      # Django core
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ThisIsAnExampleKeyForLocalDevOnly}
      DJANGO_SETTINGS_MODULE: meet.settings
      DJANGO_CONFIGURATION: Production
      PYTHONPATH: /app

      # Database
      DB_HOST: postgresql
      DB_NAME: meet
      DB_USER: meet
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_PORT: "5432"

      # Cache
      REDIS_URL: redis://redis:6379/1

      # OIDC — internal URLs use the keycloak container name;
      #        browser-facing auth endpoint uses localhost:8083
      OIDC_OP_JWKS_ENDPOINT: http://keycloak:8080/realms/meet/protocol/openid-connect/certs
      OIDC_OP_AUTHORIZATION_ENDPOINT: http://localhost:8083/realms/meet/protocol/openid-connect/auth
      OIDC_OP_TOKEN_ENDPOINT: http://keycloak:8080/realms/meet/protocol/openid-connect/token
      OIDC_OP_USER_ENDPOINT: http://keycloak:8080/realms/meet/protocol/openid-connect/userinfo
      OIDC_OP_LOGOUT_ENDPOINT: http://keycloak:8080/realms/meet/protocol/openid-connect/logout
      OIDC_RP_CLIENT_ID: meet
      OIDC_RP_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-ThisIsAnExampleKeyForDevPurposeOnly}
      OIDC_RP_SIGN_ALGO: RS256
      OIDC_RP_SCOPES: "openid email"

      # Redirect URLs
      LOGIN_REDIRECT_URL: http://localhost
      LOGIN_REDIRECT_URL_FAILURE: http://localhost
      LOGOUT_REDIRECT_URL: http://localhost
      OIDC_REDIRECT_ALLOWED_HOSTS: '["http://localhost", "http://localhost:8083"]'

      # Meet
      MEET_BASE_URL: http://localhost
      ALLOW_UNREGISTERED_ROOMS: "False"

      # LiveKit
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-localkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-localsecret}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_VERIFY_SSL: "False"

      # Recording / S3
      RECORDING_ENABLE: "True"
      RECORDING_STORAGE_EVENT_ENABLE: "True"
      RECORDING_STORAGE_EVENT_TOKEN: ${MINIO_PASSWORD:-password}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_ACCESS_KEY_ID: ${MINIO_USER:-meet}
      AWS_S3_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-password}
      AWS_STORAGE_BUCKET_NAME: recordings
      RECORDING_DOWNLOAD_BASE_URL: http://localhost/recording

      # Email (disabled by default — use mailpit if you need it)
      DJANGO_EMAIL_HOST: ${SMTP_HOST:-localhost}
      DJANGO_EMAIL_PORT: ${SMTP_PORT:-1025}
      DJANGO_EMAIL_HOST_USER: ${SMTP_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${SMTP_PASSWORD:-}
      DJANGO_EMAIL_FROM: ${SMTP_FROM:-meet@localhost}
      DJANGO_EMAIL_USE_TLS: "false"
      DJANGO_EMAIL_BRAND_NAME: Meet
      DJANGO_EMAIL_LOGO_IMG: http://localhost/assets/logo-suite-numerique.png
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 20s
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
      livekit:
        condition: service_started
      keycloak:
        condition: service_healthy

  # ── Frontend (nginx + React) ───────────────────────────────────────────────
  frontend:
    image: lasuite/meet-frontend:latest
    restart: unless-stopped
    user: "1000"
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:8080"
    environment:
      MEET_HOST: localhost
      BACKEND_INTERNAL_HOST: backend
      FRONTEND_INTERNAL_HOST: frontend
      LIVEKIT_INTERNAL_HOST: livekit
    volumes:
      - ./docker/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
