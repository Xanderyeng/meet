# Local nginx config for lasuite/meet-frontend
# Proxies API & admin requests to the Django backend container.
# The frontend image serves static files from /usr/share/nginx/html.

upstream backend_server {
    server backend:8000 fail_timeout=0;
}

server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;

    client_max_body_size 100M;

    # ── Django REST API ──────────────────────────────────────────────────────
    location ^~ /api/ {
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_pass http://backend_server;
    }

    # ── Django admin ─────────────────────────────────────────────────────────
    location ^~ /admin/ {
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_pass http://backend_server;
    }

    # ── Django static / media ─────────────────────────────────────────────────
    location ^~ /media/ {
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://backend_server;
    }

    # ── OIDC callback (handled by backend) ───────────────────────────────────
    location ^~ /oidc/ {
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_pass http://backend_server;
    }

    # ── Static assets with caching ────────────────────────────────────────────
    location ~* ^/assets/.*\.(css|js|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── React SPA fallback ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    error_page 404 =200 /index.html;
}
