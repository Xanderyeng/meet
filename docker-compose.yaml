services:
  postgresql:
    image: 'postgres:16'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}'
      interval: 1s
      timeout: 2s
      retries: 300
    environment:
      POSTGRES_DB: meet
      POSTGRES_USER: meet
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      DB_PASSWORD: aOzt7mGUC7OTeEHTIp6fcDhzxYOujJw4
      COOLIFY_CONTAINER_NAME: '"postgresql-bksgkswggg88wsw4ogo84c4g"'
    volumes:
      - '/opt/meet/data/db:/var/lib/postgresql/data'
    container_name: postgresql-bksgkswggg88wsw4ogo84c4g
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0-beta.367
      - coolify.serviceId=20
      - coolify.type=service
      - coolify.name=postgresql-bksgkswggg88wsw4ogo84c4g
      - coolify.pullRequestId=0
      - coolify.service.subId=21
      - coolify.service.subType=database
    networks:
      bksgkswggg88wsw4ogo84c4g: null
  redis:
    image: 'redis:7'
    container_name: redis-bksgkswggg88wsw4ogo84c4g
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0-beta.367
      - coolify.serviceId=20
      - coolify.type=service
      - coolify.name=redis-bksgkswggg88wsw4ogo84c4g
      - coolify.pullRequestId=0
      - coolify.service.subId=22
      - coolify.service.subType=database
    networks:
      bksgkswggg88wsw4ogo84c4g: null
    environment:
      COOLIFY_CONTAINER_NAME: '"redis-bksgkswggg88wsw4ogo84c4g"'
  livekit:
    image: 'livekit/livekit-server:latest'
    command: '--config /config.yaml'
    ports:
      - '7880:7880'
      - '7881:7881/tcp'
      - '7882:7882/udp'
    volumes:
      - '/opt/meet/livekit-server.yaml:/config.yaml'
    depends_on:
      - redis
    container_name: livekit-bksgkswggg88wsw4ogo84c4g
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0-beta.367
      - coolify.serviceId=20
      - coolify.type=service
      - coolify.name=livekit-bksgkswggg88wsw4ogo84c4g
      - coolify.pullRequestId=0
      - coolify.service.subId=43
      - coolify.service.subType=application
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-bksgkswggg88wsw4ogo84c4g-livekit.entryPoints=http
      - traefik.http.routers.http-0-bksgkswggg88wsw4ogo84c4g-livekit.middlewares=redirect-to-https
      - 'traefik.http.routers.http-0-bksgkswggg88wsw4ogo84c4g-livekit.rule=Host(`livekit.cyberseclaunchpad.com`) && PathPrefix(`/`)'
      - traefik.http.routers.http-0-bksgkswggg88wsw4ogo84c4g-livekit.service=http-0-bksgkswggg88wsw4ogo84c4g-livekit
      - traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-livekit.entryPoints=https
      - traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-livekit.middlewares=gzip
      - 'traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-livekit.rule=Host(`livekit.cyberseclaunchpad.com`) && PathPrefix(`/`)'
      - traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-livekit.service=https-0-bksgkswggg88wsw4ogo84c4g-livekit
      - traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-livekit.tls.certresolver=letsencrypt
      - traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-livekit.tls=true
      - traefik.http.services.http-0-bksgkswggg88wsw4ogo84c4g-livekit.loadbalancer.server.port=7880
      - traefik.http.services.https-0-bksgkswggg88wsw4ogo84c4g-livekit.loadbalancer.server.port=7880
      - 'caddy_0.encode=zstd gzip'
      - 'caddy_0.handle_path.0_reverse_proxy={{upstreams 7880}}'
      - 'caddy_0.handle_path=/*'
      - caddy_0.header=-Server
      - 'caddy_0.try_files={path} /index.html /index.php'
      - 'caddy_0=https://livekit.cyberseclaunchpad.com'
      - caddy_ingress_network=bksgkswggg88wsw4ogo84c4g
    networks:
      bksgkswggg88wsw4ogo84c4g: null
    environment:
      COOLIFY_CONTAINER_NAME: '"livekit-bksgkswggg88wsw4ogo84c4g"'
      COOLIFY_URL: 'https://livekit.cyberseclaunchpad.com:7880'
      COOLIFY_FQDN: 'livekit.cyberseclaunchpad.com:7880'
  backend:
    image: 'lasuite/meet-backend:latest'
    user: '1000'
    restart: always
    environment:
      RECORDING_ENABLE: 'true'
      AWS_S3_ENDPOINT_URL: 'http://minio:9000'
      AWS_S3_ACCESS_KEY_ID: '${MINIO_USER}'
      AWS_S3_SECRET_ACCESS_KEY: '${MINIO_PASSWORD}'
      AWS_STORAGE_BUCKET_NAME: recordings
      DJANGO_ALLOWED_HOSTS: '${MEET_HOST}'
      DJANGO_SECRET_KEY: '${DJANGO_SECRET_KEY}'
      DJANGO_SETTINGS_MODULE: meet.settings
      DJANGO_CONFIGURATION: Production
      PYTHONPATH: /app
      DB_HOST: postgresql
      DB_NAME: meet
      DB_USER: meet
      DB_PASSWORD: '${DB_PASSWORD}'
      DB_PORT: '5432'
      REDIS_URL: 'redis://redis:6379/1'
      OIDC_OP_JWKS_ENDPOINT: 'https://${KEYCLOAK_HOST}/realms/${REALM_NAME}/protocol/openid-connect/certs'
      OIDC_OP_AUTHORIZATION_ENDPOINT: 'https://${KEYCLOAK_HOST}/realms/${REALM_NAME}/protocol/openid-connect/auth'
      OIDC_OP_TOKEN_ENDPOINT: 'https://${KEYCLOAK_HOST}/realms/${REALM_NAME}/protocol/openid-connect/token'
      OIDC_OP_USER_ENDPOINT: 'https://${KEYCLOAK_HOST}/realms/${REALM_NAME}/protocol/openid-connect/userinfo'
      OIDC_OP_LOGOUT_ENDPOINT: 'https://${KEYCLOAK_HOST}/realms/${REALM_NAME}/protocol/openid-connect/logout'
      OIDC_RP_CLIENT_ID: meet
      OIDC_RP_CLIENT_SECRET: '${OIDC_CLIENT_SECRET}'
      OIDC_RP_SIGN_ALGO: RS256
      OIDC_RP_SCOPES: 'openid email'
      LOGIN_REDIRECT_URL: 'https://${MEET_HOST}'
      LOGIN_REDIRECT_URL_FAILURE: 'https://${MEET_HOST}'
      LOGOUT_REDIRECT_URL: 'https://${MEET_HOST}'
      OIDC_REDIRECT_ALLOWED_HOSTS: '["https://${MEET_HOST}"]'
      LIVEKIT_API_KEY: meet
      LIVEKIT_API_SECRET: '${LIVEKIT_API_SECRET}'
      LIVEKIT_API_URL: 'https://${LIVEKIT_HOST}'
      MEET_BASE_URL: 'https://${MEET_HOST}'
      ALLOW_UNREGISTERED_ROOMS: 'False'
      DJANGO_EMAIL_HOST: '${SMTP_HOST}'
      DJANGO_EMAIL_HOST_USER: '${SMTP_USER}'
      DJANGO_EMAIL_HOST_PASSWORD: '${SMTP_PASSWORD}'
      DJANGO_EMAIL_PORT: '${SMTP_PORT}'
      DJANGO_EMAIL_FROM: '${SMTP_FROM}'
      DJANGO_EMAIL_USE_TLS: 'true'
      DJANGO_EMAIL_BRAND_NAME: Meet
      DJANGO_EMAIL_LOGO_IMG: 'https://${MEET_HOST}/assets/logo-suite-numerique.png'
      MINIO_USER: minioadmin
      MINIO_PASSWORD: aOzt7mGUC7OTeEHTIp6fcDhzxYOujJw4
      MEET_HOST: meet.cyberseclaunchpad.com
      OIDC_CLIENT_SECRET: 9l05GpqOq1PB9keUDvZoTs70PpMrrBhz
      SMTP_HOST: smtp.postmarkapp.com
      SMTP_USER: 34d75fa6-6e43-4c76-8ebc-6a7a6d4ba4da
      SMTP_PASSWORD: '34d75fa6-6e43-4c76-8ebc-6a7a6d4ba4da   # same value as user'
      SMTP_PORT: '587'
      SMTP_FROM: customer@cyberseclaunchpad.com
      COOLIFY_CONTAINER_NAME: '"backend-bksgkswggg88wsw4ogo84c4g"'
    healthcheck:
      test:
        - CMD
        - python
        - manage.py
        - check
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 10s
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
      livekit:
        condition: service_started
    container_name: backend-bksgkswggg88wsw4ogo84c4g
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0-beta.367
      - coolify.serviceId=20
      - coolify.type=service
      - coolify.name=backend-bksgkswggg88wsw4ogo84c4g
      - coolify.pullRequestId=0
      - coolify.service.subId=44
      - coolify.service.subType=application
    networks:
      bksgkswggg88wsw4ogo84c4g: null
  frontend:
    image: 'lasuite/meet-frontend:latest'
    user: '1000'
    entrypoint:
      - /docker-entrypoint.sh
    command:
      - nginx
      - '-g'
      - 'daemon off;'
    environment:
      MEET_HOST: '${MEET_HOST}'
      BACKEND_INTERNAL_HOST: backend
      FRONTEND_INTERNAL_HOST: frontend
      LIVEKIT_INTERNAL_HOST: livekit
      COOLIFY_CONTAINER_NAME: '"frontend-bksgkswggg88wsw4ogo84c4g"'
      COOLIFY_URL: 'https://meet.cyberseclaunchpad.com:8080'
      COOLIFY_FQDN: 'meet.cyberseclaunchpad.com:8080'
    volumes:
      - '/opt/meet/nginx.conf:/etc/nginx/conf.d/default.conf'
    depends_on:
      backend:
        condition: service_healthy
    container_name: frontend-bksgkswggg88wsw4ogo84c4g
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0-beta.367
      - coolify.serviceId=20
      - coolify.type=service
      - coolify.name=frontend-bksgkswggg88wsw4ogo84c4g
      - coolify.pullRequestId=0
      - coolify.service.subId=45
      - coolify.service.subType=application
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-bksgkswggg88wsw4ogo84c4g-frontend.entryPoints=http
      - traefik.http.routers.http-0-bksgkswggg88wsw4ogo84c4g-frontend.middlewares=redirect-to-https
      - 'traefik.http.routers.http-0-bksgkswggg88wsw4ogo84c4g-frontend.rule=Host(`meet.cyberseclaunchpad.com`) && PathPrefix(`/`)'
      - traefik.http.routers.http-0-bksgkswggg88wsw4ogo84c4g-frontend.service=http-0-bksgkswggg88wsw4ogo84c4g-frontend
      - traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-frontend.entryPoints=https
      - traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-frontend.middlewares=gzip
      - 'traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-frontend.rule=Host(`meet.cyberseclaunchpad.com`) && PathPrefix(`/`)'
      - traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-frontend.service=https-0-bksgkswggg88wsw4ogo84c4g-frontend
      - traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-frontend.tls.certresolver=letsencrypt
      - traefik.http.routers.https-0-bksgkswggg88wsw4ogo84c4g-frontend.tls=true
      - traefik.http.services.http-0-bksgkswggg88wsw4ogo84c4g-frontend.loadbalancer.server.port=8080
      - traefik.http.services.https-0-bksgkswggg88wsw4ogo84c4g-frontend.loadbalancer.server.port=8080
      - 'caddy_0.encode=zstd gzip'
      - 'caddy_0.handle_path.0_reverse_proxy={{upstreams 8080}}'
      - 'caddy_0.handle_path=/*'
      - caddy_0.header=-Server
      - 'caddy_0.try_files={path} /index.html /index.php'
      - 'caddy_0=https://meet.cyberseclaunchpad.com'
      - caddy_ingress_network=bksgkswggg88wsw4ogo84c4g
    networks:
      bksgkswggg88wsw4ogo84c4g: null
  minio:
    image: 'minio/minio:latest'
    command: 'server /data --console-address ":9001"'
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio-console.rule=Host(`s3.cyberseclaunchpad.com`)
      - traefik.http.routers.minio-console.tls=true
      - traefik.http.routers.minio-console.tls.certresolver=letsencrypt
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
      - coolify.managed=true
      - coolify.version=4.0.0-beta.367
      - coolify.serviceId=20
      - coolify.type=service
      - coolify.name=minio-bksgkswggg88wsw4ogo84c4g
      - coolify.pullRequestId=0
      - coolify.service.subId=46
      - coolify.service.subType=application
    ports:
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: '${MINIO_USER}'
      MINIO_ROOT_PASSWORD: '${MINIO_PASSWORD}'
      MINIO_USER: minioadmin
      MINIO_PASSWORD: aOzt7mGUC7OTeEHTIp6fcDhzxYOujJw4
      COOLIFY_CONTAINER_NAME: '"minio-bksgkswggg88wsw4ogo84c4g"'
    volumes:
      - '/opt/meet/data/minio:/data'
    container_name: minio-bksgkswggg88wsw4ogo84c4g
    restart: unless-stopped
    networks:
      bksgkswggg88wsw4ogo84c4g: null
  egress:
    image: 'livekit/egress:latest'
    environment:
      EGRESS_CONFIG_FILE: /config.yaml
      COOLIFY_CONTAINER_NAME: '"egress-bksgkswggg88wsw4ogo84c4g"'
    volumes:
      - '/opt/meet/egress.yaml:/config.yaml'
    depends_on:
      - livekit
      - redis
    container_name: egress-bksgkswggg88wsw4ogo84c4g
    restart: unless-stopped
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0-beta.367
      - coolify.serviceId=20
      - coolify.type=service
      - coolify.name=egress-bksgkswggg88wsw4ogo84c4g
      - coolify.pullRequestId=0
      - coolify.service.subId=47
      - coolify.service.subType=application
    networks:
      bksgkswggg88wsw4ogo84c4g: null
volumes: {  }
networks:
  bksgkswggg88wsw4ogo84c4g:
    name: bksgkswggg88wsw4ogo84c4g
    external: true
